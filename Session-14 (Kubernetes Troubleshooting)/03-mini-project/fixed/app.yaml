apiVersion: v1
kind: Namespace
metadata:
  name: bookstore
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: bookstore
data:
  API_URL: books-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-api
  namespace: bookstore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: books-api
  template:
    metadata:
      labels:
        app: books-api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: books-api
  namespace: bookstore
spec:
  selector:
    app: books-api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bookstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                if wget -qO- -T 3 "http://$API_URL" > /dev/null; then
                  echo "$(date +%T) backend OK"
                else
                  echo "$(date +%T) backend UNREACHABLE"
                fi
                sleep 5
              done
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: API_URL
