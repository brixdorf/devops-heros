apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - echo "stored on a dynamically provisioned volume" > /data/note.txt; sleep 3600
      volumeMounts:
        - name: dynamic-data
          mountPath: /data
  volumes:
    - name: dynamic-data
      persistentVolumeClaim:
        claimName: dynamic-pvc
