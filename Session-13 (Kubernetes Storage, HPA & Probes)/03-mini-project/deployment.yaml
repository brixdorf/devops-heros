apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      initContainers:
        - name: seed-content
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              [ -f /data/index.html ] || echo "<h1>Session 13 mini project</h1>" > /data/index.html
              [ -f /data/healthz.html ] || echo ok > /data/healthz.html
          volumeMounts:
            - name: site-data
              mountPath: /data
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz.html
              port: 80
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz.html
              port: 80
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: site-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: site-data
          persistentVolumeClaim:
            claimName: site-data
