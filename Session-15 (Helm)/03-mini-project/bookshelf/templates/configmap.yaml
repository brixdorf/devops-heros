apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bookshelf.fullname" . }}-html
  labels:
    {{- include "bookshelf.labels" . | nindent 4 }}
data:
  index.html: |
    <html>
      <head><title>{{ .Values.site.title }}</title></head>
      <body style="font-family: sans-serif; background: {{ .Values.site.color }}; color: white; padding: 40px;">
        <h1>{{ .Values.site.title }} {{ .Values.site.version }}</h1>
        <p>{{ .Values.site.message }}</p>
        <p>Release: {{ .Release.Name }}, revision {{ .Release.Revision }}</p>
      </body>
    </html>
